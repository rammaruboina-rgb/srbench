[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srbench"
version = "0.2.0"
description = "Author, verify and diagnose search-resistant benchmark tasks for AI research agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Maruboina Rama Krishnudu"}]
dependencies = []

[project.scripts]
srbench = "srbench.cli:main"

[tool.setuptools]
packages = ["srbench"]
